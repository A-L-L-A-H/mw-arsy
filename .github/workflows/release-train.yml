name: Release Train

# dev → main release automation (part 1).
#
# Triggers on HUMAN push to dev. Computes the next version from the commit
# history since the last tag (conventional commits: `!:` → major, `feat:` → minor,
# else → patch), writes the 5 version files + 2 doc stamps + CHANGELOG section,
# commits that on dev, and opens the release PR dev→main with auto-merge (squash).
#
# The PR carries the `release` label. When it merges (auto-merge waits for the
# full CI matrix via main-gate), the "Release Tag" workflow picks it up and
# pushes the tag — which fires the existing Release pipeline.

on:
  push:
    branches: [dev]
    paths-ignore:
      - '.github/**'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-train
  cancel-in-progress: false

jobs:
  train:
    name: Cut release PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Compute the next version on dev
        id: version
        run: |
          git config user.name "release-train[bot]"
          git config user.email "release-train[bot]@users.noreply.github.com"
          git checkout dev
          git pull --ff-only origin dev
          OUT=$(node scripts/release-train/compute-version.mjs)
          echo "$OUT"
          VERSION=$(echo "$OUT" | sed -n 's/^next: //p')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if echo "$OUT" | grep -q '^noop'; then
            echo "noop=true" >> "$GITHUB_OUTPUT"
          else
            echo "noop=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply the release files
        if: steps.version.outputs.noop == 'false'
        run: |
          TARGET="${{ steps.version.outputs.version }}" node scripts/release-train/apply-release.mjs

      - name: Commit the release on dev
        if: steps.version.outputs.noop == 'false'
        id: commit
        run: |
          git add panel/agent/Cargo.toml panel/backend/Cargo.toml panel/cli/Cargo.toml \
                  panel/mcp/Cargo.toml panel/frontend/package.json FEATURES.md docs/testing.md \
                  CHANGELOG.md
          if git diff --cached --quiet; then
            echo "nothing to commit — noop"
            echo "sha=" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(release): v${{ steps.version.outputs.version }} [release-train]"
            git push origin dev
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the release PR and engage auto-merge
        if: steps.commit.outputs.sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          PR=$(gh pr list --base main --head dev --state open --json number \
               --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$PR" ]; then
            PR=$(gh pr create \
              --base main --head dev \
              --title "chore(release): v${VERSION} [release-train]" \
              --label "release" \
              --body "Automated release PR cut by the release train from \`dev\`.

          Version: **v${VERSION}**

          Merging publishes v${VERSION} through the tag-triggered Release pipeline
          (changelog → regression pins → static musl builds → Sigstore signing
          → publish → install smoke test).")
          fi
          gh pr merge "$PR" --auto --squash

      - name: Release succeeded — close any open failure issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE=$(gh issue list --search "automation/release-failure in:title state:open" \
                    --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$ISSUE" ]; then
            gh issue close "$ISSUE" \
              --comment "Latest release-train run succeeded: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi

      - name: Open an issue when the train fails
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="automation/release-failure: run ${GITHUB_RUN_ID}"
          BODY=$(cat <<EOF
          The release train failed.

          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Job: ${GITHUB_JOB}
          - Trigger commit: ${GITHUB_SHA}

          Check the failed step's log for the cause. This issue is closed
          automatically by the next successful run.
          EOF
          )
          ISSUE=$(gh issue list --search "automation/release-failure in:title state:open" \
                    --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi