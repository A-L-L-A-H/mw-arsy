name: Release Train

# dev → main release automation. The ladder:
#
#   push to dev  ──▶ compute next version (conventional commits since last tag)
#                ──▶ write 4×Cargo.toml + package.json + 2 doc stamps + CHANGELOG
#                ──▶ commit on dev ──▶ PR dev→main ──▶ auto-merge (squash)
#   PR merges    ──▶ push to main ──▶ this workflow again ──▶ tag vX.Y.Z
#                ──▶ the existing tag-triggered Release pipeline publishes
#
# So `main` only ever moves through the release PR, and every merge into
# `main` IS a release — which is the owner's chosen cadence. The tag step
# fires only when the run's ref is `main` itself, and only when the version
# the merge carried has no tag yet; a re-run or an unrelated main push finds
# the tag present and does nothing.
#
# The train obeys the main-gate ruleset: its PR carries the same required
# checks as any human PR, so a red release never ships. Its own merge
# commits carry `[release-train]` so the apply steps skip themselves on the
# tag-cutting run (the compute script's noop guard is the second defence).
#
# Kill switch: disable this workflow in the Actions UI; `docs/automation.md`
# documents the manual release ladder that replaces it.

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '.github/**'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-train
  cancel-in-progress: false

jobs:
  train:
    name: Cut release
    runs-on: ubuntu-latest
    steps:
      # The trigger is a push to main or dev. A push to main whose head commit
      # is the train's own squash merge must NOT cut another release — it is
      # the signal to TAG instead. Everything downstream keys off this guard.
      - name: Is this the train's own merge?
        id: guard
        run: |
          if [[ "${{ github.event.head_commit.message }}" == *"[release-train]"* ]]; then
            echo "own=own-commit" >> "$GITHUB_OUTPUT"
          else
            echo "own=fresh-commits" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        with:
          # fetch-depth 0: the version compute walks the log back to the last
          # tag, and `git describe` needs the tags themselves.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      # The release files are written on TOP of dev, whatever ref the event
      # carried, so compute runs against dev's tip. main's newest commit is
      # the squash of dev's own commits, so dev's log classifies identically.
      - name: Compute the next version on dev
        if: steps.guard.outputs.own == 'fresh-commits'
        id: version
        run: |
          git config user.name "release-train[bot]"
          git config user.email "release-train[bot]@users.noreply.github.com"
          git checkout dev
          git pull --ff-only origin dev
          OUT=$(node scripts/release-train/compute-version.mjs)
          echo "$OUT"
          VERSION=$(echo "$OUT" | sed -n 's/^next: //p')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if echo "$OUT" | grep -q '^noop'; then
            echo "noop=true" >> "$GITHUB_OUTPUT"
          else
            echo "noop=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply the release files
        if: steps.guard.outputs.own == 'fresh-commits' && steps.version.outputs.noop == 'false'
        run: |
          TARGET="${{ steps.version.outputs.version }}" node scripts/release-train/apply-release.mjs

      - name: Commit the release on dev
        if: steps.guard.outputs.own == 'fresh-commits' && steps.version.outputs.noop == 'false'
        id: commit
        run: |
          # Rule 4: add by explicit path — the tree may carry the owner's WIP.
          git add panel/agent/Cargo.toml panel/backend/Cargo.toml panel/cli/Cargo.toml \
                  panel/mcp/Cargo.toml panel/frontend/package.json FEATURES.md docs/testing.md \
                  CHANGELOG.md
          if git diff --cached --quiet; then
            echo "nothing to commit — noop"
            echo "sha=" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(release): v${{ steps.version.outputs.version }} [release-train]"
            git push origin dev
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the release PR and engage auto-merge
        if: steps.guard.outputs.own == 'fresh-commits' && steps.commit.outputs.sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Idempotent: when a release PR is already open, this run's commit
          # simply rides along — never a second PR for the same ladder.
          PR=$(gh pr list --base main --head dev --state open --json number \
               --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$PR" ]; then
            PR=$(gh pr create \
              --base main --head dev \
              --title "chore(release): v${VERSION} [release-train]" \
              --body "Automated release PR cut by the release train from \`dev\`.

          Version: **v${VERSION}**

          Merging publishes v${VERSION} through the tag-triggered Release
          pipeline (changelog → regression pins → static musl builds →
          Sigstore signing → publish → install smoke test).")
          fi
          # --auto defers to the main-gate ruleset: GitHub merges when the
          # required checks pass, and not one second earlier.
          gh pr merge "$PR" --auto --squash

      # Runs on EVERY train run, but does something only on main: the release
      # merge just landed here carrying a version whose tag does not exist.
      # On a dev run, or on a main push whose version is already tagged, this
      # exits 0 without touching anything.
      - name: Tag the release when main carries an untagged version
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version = ' panel/agent/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag ${TAG} already exists — nothing to do"
            exit 0
          fi
          git tag "${TAG}"
          git push origin "${TAG}"
          echo "tagged ${TAG} at $(git rev-parse HEAD)"

      - name: Release succeeded — close any open failure issue
        if: github.ref == 'refs/heads/main' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE=$(gh issue list --search "automation/release-failure in:title state:open" \
                    --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$ISSUE" ]; then
            gh issue close "$ISSUE" \
              --comment "Latest release-train run succeeded: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi

      - name: Open an issue when the train fails
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="automation/release-failure: run ${GITHUB_RUN_ID}"
          BODY=$(cat <<EOF
          The release train failed.

          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Job: ${GITHUB_JOB}
          - Ref: ${GITHUB_REF}
          - Trigger commit: ${GITHUB_SHA}

          Check the failed step's log for the cause. This issue is closed
          automatically by the next successful run that reaches main.
          EOF
          )
          ISSUE=$(gh issue list --search "automation/release-failure in:title state:open" \
                    --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
