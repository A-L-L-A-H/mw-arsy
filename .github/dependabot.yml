version: 2
updates:
  # Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/panel/agent"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "cargo"
    directory: "/panel/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "cargo"
    directory: "/panel/cli"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # The MCP server ships its own crate and is audited by ci.yml's `Audit MCP`
  # step, but had no dependabot entry — its dependencies only ever moved when
  # a lockfile bump was copied by hand.
  - package-ecosystem: "cargo"
    directory: "/panel/mcp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Frontend dependencies
  - package-ecosystem: "npm"
    directory: "/panel/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
